<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הורדת מאגר ספרים</title>
<style>
:root {
    --primary: #1976d2;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --on-surface: #1a1a1a;
    --surface-container: #f3f4f6;
    --outline: #d1d5db;
    --font-family: system-ui, sans-serif;
    --font-size: 15px;
    --line-height: 1.5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--line-height);
    padding: 20px 20px 60px;
    max-width: 700px;
    margin: 0 auto;
}
h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 4px; }
#release-name { font-size: 0.8rem; opacity: 0.5; margin-bottom: 16px; }
#notice {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.85rem;
}
#error-msg {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
}
.full-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
}
.full-bar span { flex: 1; font-weight: 600; font-size: 0.95rem; }
#full-library-btn {
    display: none;
    align-items: center;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
#full-library-btn:hover { opacity: 0.88; }
#tree { border: 1px solid var(--outline); border-radius: 12px; overflow: hidden; }
.tree-node + .tree-node { border-top: 1px solid var(--outline); }
.tree-children .tree-node { border-top: 1px solid var(--outline); }
.tree-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    transition: background 0.12s;
}
.tree-row:hover { background: var(--surface-container); }
.toggle { width: 16px; flex-shrink: 0; text-align: center; cursor: pointer; font-size: 0.8rem; color: var(--primary); user-select: none; }
.node-name { flex: 1; font-size: 0.95rem; }
.node-name.folder { font-weight: 600; cursor: pointer; }
.node-name.folder:hover { color: var(--primary); }
.node-size { font-size: 0.75rem; opacity: 0.45; flex-shrink: 0; white-space: nowrap; }
.dl-btn {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 14px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    white-space: nowrap;
}
.dl-btn:hover { opacity: 0.88; }
.dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
#search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 16px;
}
#search-icon { flex-shrink: 0; width: 18px; height: 18px; opacity: 0.45; fill: var(--on-surface); }
#search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--on-surface);
    outline: none;
    direction: rtl;
}
#search-input::placeholder { opacity: 0.4; }
#search-clear { display: none; background: none; border: none; cursor: pointer; font-size: 1rem; opacity: 0.4; padding: 0; line-height: 1; flex-shrink: 0; }
#search-clear:hover { opacity: 0.8; }
.search-path { font-size: 0.72rem; opacity: 0.4; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.loading, .empty { text-align: center; padding: 36px; opacity: 0.45; }
#success-msg { display:none; background:#f0fdf4; color:#15803d; border:1px solid #86efac; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:0.9rem; font-weight:600; }
#progress-bar { display:none; background:var(--surface-container); border:1px solid var(--outline); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
</style>
</head>
<body>

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <h2 style="margin-bottom:0;">הורדת מאגר ספרים</h2>
</div>
<div id="release-name"></div>

<div id="notice">
    ⚠️ דף זה פועל בכרום / אדג' בלבד. הורדה וחילוץ מתבצעים ישירות בדפדפן — ללא מגבלת זמן.
</div>

<div id="error-msg"></div>
<div id="success-msg"></div>

<div id="progress-bar">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.85rem;">
        <span class="progress-name" style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <span class="progress-label" style="opacity:0.55;flex-shrink:0;margin-right:8px;">0%</span>
    </div>
    <div style="background:var(--outline);border-radius:99px;height:6px;overflow:hidden;">
        <div class="progress-fill" style="background:var(--primary);height:100%;width:0%;transition:width 0.2s;border-radius:99px;"></div>
    </div>
</div>

<div id="search-wrap">
    <svg id="search-icon" viewBox="0 0 24 24"><path d="M16.1017 17.1624C14.717 18.3101 12.9391 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11C19 12.9391 18.3101 14.717 17.1624 16.1018L21.7803 20.7197C22.0732 21.0126 22.0732 21.4874 21.7803 21.7803C21.4874 22.0732 21.0125 22.0732 20.7196 21.7803L16.1017 17.1624ZM17.5 11C17.5 7.41015 14.5899 4.5 11 4.5C7.41015 4.5 7.41015 4.5 11 4.5Z"/></svg>
    <input id="search-input" type="text" placeholder="חפש ספר או תיקייה...">
    <button id="search-clear" title="נקה חיפוש">✕</button>
</div>

<div class="full-bar">
    <span>המאגר המלא — כל הספרים בקובץ אחד</span>
    <button id="full-library-btn" onclick="startDownloadAll(this)">הורד הכל</button>
</div>

<div id="tree">
    <div class="loading" id="loading">טוען רשימה...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="books_data.js"></script>
<script>
const GITHUB_REPO = 'Open-Otzarya-Projects/Otzarya-Unofficial-Books';
const LATEST_DL   = `https://github.com/${GITHUB_REPO}/releases/latest/download/`;

let expandedPaths   = new Set();
let currentManifest = [];

// ─── טעינת נתונים ─────────────────────────────────────────────────

async function fetchWithFallback(url) {
    const attempts = [
        () => fetch(url),
        () => fetch('https://corsproxy.io/?' + encodeURIComponent(url)),
        () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)),
    ];
    for (const attempt of attempts) {
        try {
            const res = await attempt();
            if (res.ok) return res;
        } catch {}
    }
    throw new Error('לא ניתן להגיע לגיטאב');
}

async function getAssetUrls() {
    try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases/latest`);
        if (!res.ok) return {};
        const json = await res.json();
        const map = {};
        // asset.url = https://api.github.com/repos/.../releases/assets/{id}
        // fetching it with Accept:application/octet-stream redirects to CDN with CORS headers
        for (const asset of json.assets || []) map[asset.name] = { apiUrl: asset.url, dlUrl: asset.browser_download_url };
        return map;
    } catch { return {}; }
}

async function boot() {
    let data = typeof BOOKS_DATA !== 'undefined' ? BOOKS_DATA : null;
    try {
        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO}/main/books_data.js`);
        if (res.ok) {
            const text = await res.text();
            const json = text.replace(/^\s*const BOOKS_DATA\s*=\s*/, '').replace(/\s*;\s*$/, '');
            data = JSON.parse(json);
        }
    } catch {}

    if (!data || !data.length) {
        showError('לא ניתן לטעון את רשימת הספרים');
        hideLoading();
        return;
    }

    const assetUrls = await getAssetUrls();
    currentManifest = data.map(item => ({
        ...item,
        assetInfo: assetUrls[item.zip] || null,
        downloadUrl: LATEST_DL + item.zip
    }));
    hideLoading();
    document.getElementById('full-library-btn').style.display = 'inline-flex';
    renderTree(currentManifest);
    initSearch();
}

// ─── עץ ────────────────────────────────────────────────────────────

function buildTree(manifest, parentPath) {
    return manifest
        .filter(i => i.parent === parentPath)
        .map(i => ({ ...i, children: buildTree(manifest, i.path) }));
}

function renderTree(manifest) {
    const roots = buildTree(manifest, '');
    const container = document.getElementById('tree');
    container.innerHTML = '';
    if (!roots.length) { container.innerHTML = '<div class="empty">אין נתונים</div>'; return; }
    roots.forEach(node => container.appendChild(createNode(node, 0)));
}

function createNode(node, depth) {
    const hasChildren = node.children && node.children.length > 0;
    const isExpanded  = expandedPaths.has(node.path);

    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    const row = document.createElement('div');
    row.className = 'tree-row';
    row.style.paddingRight = (16 + depth * 24) + 'px';

    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    if (hasChildren) {
        toggle.textContent = isExpanded ? '▾' : '▸';
        toggle.addEventListener('click', () => toggleNode(node.path));
    } else {
        toggle.textContent = '•';
        toggle.style.opacity = '0.25';
        toggle.style.cursor  = 'default';
    }
    row.appendChild(toggle);

    const name = document.createElement('span');
    name.className = 'node-name' + (hasChildren ? ' folder' : '');
    name.textContent = node.name;
    if (hasChildren) name.addEventListener('click', () => toggleNode(node.path));
    row.appendChild(name);

    if (node.size) {
        const size = document.createElement('span');
        size.className = 'node-size';
        size.textContent = node.size;
        row.appendChild(size);
    }

    const btn = document.createElement('button');
    btn.className = 'dl-btn';
    btn.textContent = 'הורד';
    btn.onclick = () => downloadAndExtract(node, btn);
    row.appendChild(btn);

    wrapper.appendChild(row);

    if (hasChildren && isExpanded) {
        const sub = document.createElement('div');
        sub.className = 'tree-children';
        node.children.forEach(child => sub.appendChild(createNode(child, depth + 1)));
        wrapper.appendChild(sub);
    }

    return wrapper;
}

function toggleNode(path) {
    expandedPaths.has(path) ? expandedPaths.delete(path) : expandedPaths.add(path);
    renderTree(currentManifest);
}

// ─── הורדה + חילוץ (ללא מגבלת זמן) ───────────────────────────────

async function downloadZip(node, onProgress) {
    // נסה דרך GitHub API asset URL: api.github.com מחזיר CORS headers גם על ה-redirect ל-CDN
    if (node.assetInfo) {
        try {
            const response = await fetch(node.assetInfo.apiUrl, {
                headers: { Accept: 'application/octet-stream' }
            });
            if (response.ok) {
                const total = parseInt(response.headers.get('content-length') || '0');
                let received = 0;
                const chunks = [];
                const reader = response.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    if (total && onProgress) onProgress(received / total);
                }
                return new Blob(chunks).arrayBuffer();
            }
        } catch {}
    }
    // Fallback: הורדה ישירה ע"י הדפדפן (ללא חילוץ אוטומטי)
    const a = document.createElement('a');
    a.href = node.downloadUrl;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    throw new Error('NATIVE_DOWNLOAD');
}

async function downloadAndExtract(node, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    showProgress(node.name, 0);

    // ─ נסה File System Access API (דורש HTTPS) ─
    if (typeof window.showDirectoryPicker === 'function') {
        let rootDir;
        try {
            rootDir = await window.showDirectoryPicker({ mode: 'readwrite' });
        } catch (e) {
            btn.disabled = false;
            btn.textContent = 'הורד';
            hideProgress();
            if (e.name !== 'AbortError') showError('לא ניתן לבחור תיקייה: ' + (e.message || String(e)));
            return;
        }

        try {
            updateProgress(2, 'מוריד...');
            const buffer = await downloadZip(node, p =>
                updateProgress(2 + Math.round(p * 55), 'מוריד...'));

            updateProgress(58, 'מחלץ...');
            const zip = await JSZip.loadAsync(buffer);
            const entries = Object.values(zip.files);

            const pathParts = node.path.split('/');
            let destDir = rootDir;
            for (const part of pathParts) destDir = await destDir.getDirectoryHandle(part, { create: true });

            let done2 = 0;
            for (const entry of entries) {
                const parts = entry.name.split('/').filter(Boolean);
                if (!parts.length) continue;
                if (entry.dir) {
                    let d = destDir;
                    for (const p of parts) d = await d.getDirectoryHandle(p, { create: true });
                } else {
                    let d = destDir;
                    for (let i = 0; i < parts.length - 1; i++) d = await d.getDirectoryHandle(parts[i], { create: true });
                    const fh = await d.getFileHandle(parts[parts.length - 1], { create: true });
                    const w  = await fh.createWritable();
                    await w.write(await entry.async('arraybuffer'));
                    await w.close();
                }
                done2++;
                updateProgress(58 + Math.round((done2 / entries.length) * 40), 'מחלץ...');
            }
            updateProgress(100, 'הושלם');
            showSuccess(`"${node.name}" הורד וחולץ בהצלחה`);
        } catch (e) {
            if (e.message === 'NATIVE_DOWNLOAD') {
                updateProgress(100, 'מוריד...');
                showSuccess(`"${node.name}" מוריד — לאחר הורדה חלץ לתיקיית הספרים`);
            } else {
                showError('שגיאה: ' + e.message);
            }
        } finally {
            btn.disabled = false;
            btn.textContent = 'הורד';
            setTimeout(hideProgress, 2000);
        }
        return;
    }

    // ─ Fallback: הורדה ישירה ללא חילוץ אוטומטי ─
    try {
        updateProgress(5, 'מוריד...');
        const buffer = await downloadZip(node, p =>
            updateProgress(5 + Math.round(p * 88), 'מוריד...'));
        updateProgress(95, 'מכין...');
        const blob = new Blob([buffer], { type: 'application/zip' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = node.zip || (node.name + '.zip');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        updateProgress(100, 'הושלם');
        showSuccess(`"${node.name}" הורד — חלץ את הקובץ לתיקיית הספרים של אוצריא`);
    } catch (e) {
        if (e.message === 'NATIVE_DOWNLOAD') {
            showSuccess(`"${node.name}" מוריד — לאחר הורדה חלץ לתיקיית הספרים`);
        } else {
            showError('שגיאה: ' + e.message);
        }
    } finally {
        btn.disabled = false;
        btn.textContent = 'הורד';
        setTimeout(hideProgress, 3000);
    }
}

async function startDownloadAll(btn) {
    const rootItems = currentManifest.filter(i => i.depth === 0);
    if (!rootItems.length) return;

    btn.disabled = true;
    btn.textContent = '...';
    const failed = [];

    if (typeof window.showDirectoryPicker === 'function') {
        let rootDir;
        try {
            rootDir = await window.showDirectoryPicker({ mode: 'readwrite' });
        } catch (e) {
            btn.disabled = false;
            btn.textContent = 'הורד הכל';
            if (e.name !== 'AbortError') showError('לא ניתן לבחור תיקייה: ' + (e.message || String(e)));
            return;
        }

        for (let i = 0; i < rootItems.length; i++) {
            const node = rootItems[i];
            showProgress(`[${i+1}/${rootItems.length}] ${node.name}`, Math.round(i / rootItems.length * 100));
            try {
                const buffer = await downloadZip(node.downloadUrl, p =>
                    updateProgress(Math.round((i + p * 0.7) / rootItems.length * 100), `מוריד... [${i+1}/${rootItems.length}]`));
                updateProgress(Math.round((i + 0.7) / rootItems.length * 100), `מחלץ... [${i+1}/${rootItems.length}]`);
                const zip = await JSZip.loadAsync(buffer);
                const pathParts = node.path.split('/');
                let destDir = rootDir;
                for (const part of pathParts) destDir = await destDir.getDirectoryHandle(part, { create: true });
                for (const entry of Object.values(zip.files)) {
                    const parts = entry.name.split('/').filter(Boolean);
                    if (!parts.length) continue;
                    if (entry.dir) {
                        let d = destDir;
                        for (const p of parts) d = await d.getDirectoryHandle(p, { create: true });
                    } else {
                        let d = destDir;
                        for (let j = 0; j < parts.length - 1; j++) d = await d.getDirectoryHandle(parts[j], { create: true });
                        const fh = await d.getFileHandle(parts[parts.length - 1], { create: true });
                        const w = await fh.createWritable();
                        await w.write(await entry.async('arraybuffer'));
                        await w.close();
                    }
                }
            } catch (e) {
                failed.push(node.name);
            }
        }
    } else {
        // Fallback: הורד ZIPs אחד אחד
        for (let i = 0; i < rootItems.length; i++) {
            const node = rootItems[i];
            showProgress(`[${i+1}/${rootItems.length}] ${node.name}`, Math.round(i / rootItems.length * 100));
            try {
                const buffer = await downloadZip(node.downloadUrl, p =>
                    updateProgress(Math.round((i + p) / rootItems.length * 100), `מוריד... [${i+1}/${rootItems.length}]`));
                const blob = new Blob([buffer], { type: 'application/zip' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = node.zip || (node.name + '.zip');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
                await new Promise(r => setTimeout(r, 800));
            } catch (e) {
                failed.push(node.name);
            }
        }
    }

    updateProgress(100, 'הושלם');
    if (failed.length) showError(`נכשלו: ${failed.join(', ')}`);
    else showSuccess(`המאגר המלא הורד בהצלחה — ${rootItems.length} תיקיות`);
    btn.disabled = false;
    btn.textContent = 'הורד הכל';
    setTimeout(hideProgress, 2000);
}

// ─── חיפוש ─────────────────────────────────────────────────────────

function initSearch() {
    const input = document.getElementById('search-input');
    const clear = document.getElementById('search-clear');
    input.addEventListener('input', () => {
        const q = input.value.trim();
        clear.style.display = q ? 'block' : 'none';
        q ? renderSearchResults(q) : renderTree(currentManifest);
    });
    clear.addEventListener('click', () => {
        input.value = '';
        clear.style.display = 'none';
        renderTree(currentManifest);
        input.focus();
    });
}

function renderSearchResults(query) {
    const q = query.toLowerCase();
    const matches = currentManifest.filter(i => i.name.toLowerCase().includes(q) || i.path.toLowerCase().includes(q));
    const container = document.getElementById('tree');
    container.innerHTML = '';
    if (!matches.length) { container.innerHTML = '<div class="empty">לא נמצאו תוצאות</div>'; return; }
    matches.forEach(item => {
        const row = document.createElement('div');
        row.className = 'tree-row';
        row.style.paddingRight = '14px';
        const name = document.createElement('span');
        name.className = 'node-name';
        name.textContent = item.name;
        row.appendChild(name);
        if (item.parent) {
            const path = document.createElement('span');
            path.className = 'search-path';
            path.textContent = item.parent;
            row.appendChild(path);
        }
        if (item.size) {
            const size = document.createElement('span');
            size.className = 'node-size';
            size.textContent = item.size;
            row.appendChild(size);
        }
        const btn = document.createElement('button');
        btn.className = 'dl-btn';
        btn.textContent = 'הורד';
        btn.onclick = () => downloadAndExtract(item, btn);
        row.appendChild(btn);
        const wrapper = document.createElement('div');
        wrapper.className = 'tree-node';
        wrapper.appendChild(row);
        container.appendChild(wrapper);
    });
}

// ─── UI ────────────────────────────────────────────────────────────

function showProgress(name, pct) {
    const el = document.getElementById('progress-bar');
    el.style.display = 'block';
    el.querySelector('.progress-name').textContent = name;
    el.querySelector('.progress-fill').style.width = pct + '%';
    el.querySelector('.progress-label').textContent = pct + '%';
}
function updateProgress(pct, label) {
    const el = document.getElementById('progress-bar');
    el.querySelector('.progress-fill').style.width = pct + '%';
    el.querySelector('.progress-label').textContent = label || (pct + '%');
}
function hideProgress() { document.getElementById('progress-bar').style.display = 'none'; }
function hideLoading() { const el = document.getElementById('loading'); if (el) el.style.display = 'none'; }
function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = 'שגיאה: ' + msg;
    el.style.display = 'block';
}
function showSuccess(msg) {
    const el = document.getElementById('success-msg');
    el.textContent = '✓ ' + msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 7000);
}

boot();
</script>
</body>
</html>
