<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הורדת מאגר ספרים</title>
<style>
:root {
    --primary: #1976d2;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --on-surface: #1a1a1a;
    --surface-container: #f3f4f6;
    --outline: #d1d5db;
    --font-family: system-ui, sans-serif;
    --font-size: 15px;
    --line-height: 1.5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--line-height);
    padding: 20px 20px 60px;
}

h2 {
    color: var(--primary);
    font-size: 1.4rem;
    margin-bottom: 4px;
}
#release-name {
    font-size: 0.8rem;
    opacity: 0.5;
    margin-bottom: 16px;
}

/* שגיאה */
#error-msg {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
}

/* פס המאגר המלא */
.full-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
}
.full-bar span { flex: 1; font-weight: 600; font-size: 0.95rem; }
#full-library-btn {
    display: none;
    align-items: center;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
#full-library-btn:hover { opacity: 0.88; }

/* עץ */
#tree {
    border: 1px solid var(--outline);
    border-radius: 12px;
    overflow: hidden;
}
.tree-node + .tree-node { border-top: 1px solid var(--outline); }
.tree-children .tree-node { border-top: 1px solid var(--outline); }

.tree-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    transition: background 0.12s;
}
.tree-row:hover { background: var(--surface-container); }

.toggle {
    width: 16px;
    flex-shrink: 0;
    text-align: center;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--primary);
    user-select: none;
}

.node-name {
    flex: 1;
    font-size: 0.95rem;
}
.node-name.folder {
    font-weight: 600;
    cursor: pointer;
}
.node-name.folder:hover { color: var(--primary); }

.node-size {
    font-size: 0.75rem;
    opacity: 0.45;
    flex-shrink: 0;
    white-space: nowrap;
}

.dl-btn {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 14px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    white-space: nowrap;
}
.dl-btn:hover { opacity: 0.88; }
.dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* חיפוש */
#search-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 8px 14px;
    margin-bottom: 16px;
}
#search-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    opacity: 0.45;
    fill: var(--on-surface);
}
#search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--on-surface);
    outline: none;
    direction: rtl;
}
#search-input::placeholder { opacity: 0.4; }
#search-clear {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.4;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
}
#search-clear:hover { opacity: 0.8; }

.search-path {
    font-size: 0.72rem;
    opacity: 0.4;
    direction: ltr;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
}

.loading, .empty {
    text-align: center;
    padding: 36px;
    opacity: 0.45;
}
</style>
</head>
<body>

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <h2 style="margin-bottom:0;">הורדת מאגר ספרים</h2>
    <div id="filter-bar" style="display:none;">
        <button id="filter-btn" onclick="toggleNewFilter()" style="
            background:var(--surface-container);color:var(--on-surface);
            border:1px solid var(--outline);border-radius:20px;
            padding:5px 14px;font-family:inherit;font-size:0.82rem;
            font-weight:600;cursor:pointer;white-space:nowrap;
            transition:background 0.15s,color 0.15s,border-color 0.15s;">
            <span id="filter-label">הצג חדשים ועדכונים</span>
        </button>
    </div>
</div>
<div id="release-name"></div>

<div id="error-msg"></div>

<div id="search-wrap">
    <svg id="search-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.1017 17.1624C14.717 18.3101 12.9391 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11C19 12.9391 18.3101 14.717 17.1624 16.1018L21.7803 20.7197C22.0732 21.0126 22.0732 21.4874 21.7803 21.7803C21.4874 22.0732 21.0125 22.0732 20.7196 21.7803L16.1017 17.1624ZM17.5 11C17.5 7.41015 14.5899 4.5 11 4.5C7.41015 4.5 4.5 7.41015 4.5 11C4.5 14.5899 7.41015 17.5 11 17.5C14.5899 17.5 17.5 14.5899 17.5 11Z"/></svg>
    <input id="search-input" type="text" placeholder="חפש ספר או תיקייה...">
    <button id="search-clear" title="נקה חיפוש">✕</button>
</div>

<div class="full-bar">
    <span>המאגר המלא — כל הספרים בקובץ אחד</span>
    <button id="full-library-btn">הורד הכל</button>
</div>

<!-- הודעת הצלחה -->
<div id="success-msg" style="display:none;background:#f0fdf4;color:#15803d;border:1px solid #86efac;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:0.9rem;font-weight:600;"></div>

<!-- מד התקדמות -->
<div id="progress-bar" style="display:none;background:var(--surface-container);border:1px solid var(--outline);border-radius:12px;padding:14px 16px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.85rem;">
        <span class="progress-name" style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <span class="progress-label" style="opacity:0.55;flex-shrink:0;margin-right:8px;">0%</span>
    </div>
    <div style="background:var(--outline);border-radius:99px;height:6px;overflow:hidden;">
        <div class="progress-fill" style="background:var(--primary);height:100%;width:0%;transition:width 0.2s;border-radius:99px;"></div>
    </div>
</div>

<!-- fallback: העתקת קישור -->
<div id="copy-toast" style="display:none;position:fixed;bottom:20px;right:20px;left:20px;background:#1a1a1a;color:#fff;border-radius:12px;padding:14px 16px;z-index:999;font-size:0.88rem;box-shadow:0 4px 20px rgba(0,0,0,0.35);">
    <div style="font-weight:700;margin-bottom:4px;">הורדה ישירה לא נתמכת — הועתק ללוח</div>
    <div style="opacity:0.7;margin-bottom:6px;font-size:0.82rem;">הדבק בדפדפן כדי להוריד את "<span class="copy-name"></span>"</div>
    <div class="copy-url" style="opacity:0.45;font-size:0.75rem;word-break:break-all;direction:ltr;text-align:left;"></div>
</div>

<div id="tree">
    <div class="loading" id="loading">טוען רשימה...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="books_data.js"></script>
<script src="app.js"></script>
</body>
</html>
